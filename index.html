<!DOCTYPE html>
<html data-ui="education" lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skillbase</title>
  <link rel="stylesheet" href="ui/css/tokens.css?v=8">
  <link rel="stylesheet" href="ui/css/themes/education.css?v=8">
  <link rel="stylesheet" href="ui/css/themes/operations.css?v=8">
  <link rel="stylesheet" href="ui/css/themes/depot.css?v=8">
  <link rel="stylesheet" href="ui/css/base.css?v=8">
  <link rel="stylesheet" href="ui/css/components.css?v=8">
  <script type="module" src="shared/main.js?v=8"></script>
  <script>
    (function() {
      var theme = localStorage.getItem('sb-theme') || 'system';
      if (theme === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <a href="#app" class="skip-link">К содержимому</a>
  <div id="sidebar-container"></div>
  <div id="sidebar-backdrop" class="sidebar-backdrop"></div>
  <div class="shell">
    <header class="topbar">
      <button id="sidebar-toggle" type="button" aria-label="Меню" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="logo">Skillbase</div>
      <nav id="nav" aria-label="Разделы"></nav>
      <button id="theme-toggle" type="button" aria-label="Переключить тему">
        🌓
      </button>
    </header>
    <main id="app" tabindex="-1"></main>
  </div>
  <div id="loading-spinner" class="loading-spinner" style="display: none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="#E5B94F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.41-1.42M18.36 4.22l-1.42 1.42M19.78 18.36l-1.42-1.42"/>
    </svg>
  </div>
</body>
</html>
