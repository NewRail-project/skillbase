<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<body style="font:14px monospace;padding:12px;background:#111;color:#0f0;white-space:pre-wrap"><div id="o">проверка...</div>
<script type="module">
const list = [
 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js',
 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js',
 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js',
 './configs/firebase.js', './shared/firebase.js', './core/auth.js', './shared/app.js', './shared/main.js'];
const o = document.getElementById('o'); o.textContent = '';
for (const u of list) {
  try { await import(u); o.textContent += 'OK    ' + u + '\n'; }
  catch (e) { o.textContent += 'FAIL  ' + u + '\n      ' + e.message + '\n'; }
}
o.textContent += 'готово';
</script>
